<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login - Eurofilm</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script defer src="../js/components/load.js" type="module"></script>
    <script defer src="../js/auth/login.js" type="module"></script>
    <!-- Otros Servicios -->
</head>

<body>
    <header id="cabecera"></header>
    <main class="auth-container">
        <form id="loginForm" class="auth">
            <h1>Iniciar Sesión</h1>
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div id="mensaje" style="color: red; display: none;"></div>

            <button type="submit" id="btnLogin">Entrar</button>
            <p>¿No tienes cuenta? <a href="./register.html">Crear cuenta</a>
        </form>
    </main>
    <footer id="footer"></footer>
</body>

</html>
