<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="../css/global.css">
    <!-- Estilos Únicos -->
    <link rel="stylesheet" href="../css/profile.css">
    <script defer src="../js/perfil/verPerfil.js" type="module"></script>
    <script defer src="../js/perfil/updatePerfil.js" type="module"></script>
</head>

<body>
    <header id="cabecera"></header>
    <main>
            <h2>Perfil</h2>
            <div class="perfil-container">
                <p><strong>ALTA:</strong></p>
                <p><strong>Nombre:</strong></p>
                <p><strong>Username:</strong></p>
                <form id="form-profile">
                    <h2>Actualiza tu Usuario</h2><br>
                    <label>Name</label>
                    <input id="nombre" value="" name="nombre" disabled><br><br>

                    <label>Username</label>
                    <input id="username" value="" name="username" disabled><br><br>

                    <label>Email</label>
                    <input id="email" value="" name="email" disabled><br><br>

                    <label>Country</label>
                    <input id="country" value="" name="country" disabled><br><br>

                    <label>Bio</label>
                    <textarea id="bio" value="" name="bio" disabled></textarea><br><br>

                    <button type="button" id="btn-edit">Editar</button>
                    <button type="submit" id="btn-save">Guardar</button><br><br>
                </form>
            </div>
    </main>
    <footer id="footer"></footer>
</body>

</html>
